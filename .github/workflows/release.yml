on: push
#    branches:
#      - 'main'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Set up JDK 21
        uses: actions/setup-java@v1
        with:
          java-version: 21

      - name: build jars
        run: SOURCE_JARS=false ./gradlew jar

      - name: upload neo jar
        uses: actions/upload-artifact@v4
        with:
          name: neo-jar
          path: platform/neoforge/build/libs/*.jar

      - name: upload fabric jar
        uses: actions/upload-artifact@v4
        with:
          name: fabric-jar
          path: platform/fabric/build/libs/*.jar

      - name: upload forge jar
        uses: actions/upload-artifact@v4
        with:
          name: forge-jar
          path: platform/forge/build/libs/*.jar

  neo-setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: install xml parser
        run: npm install fast-xml-parser

      - name: create neo matrix
        run: echo "VERSIONS=$(node .github/actions/neo-matrix.js)" >> $GITHUB_OUTPUT
        id: create-neo-matrix
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
    outputs:
      VERSIONS: ${{ steps.create-neo-matrix.outputs.VERSIONS }}

  neo-build:
    runs-on: ubuntu-latest
    needs: [build, neo-setup]
    strategy:
      matrix:
        neo-version: ${{ fromJSON(needs.neo-setup.outputs.VERSIONS) }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: 'NotStirred/dasm-mod-neoforge-ci'

      - name: download neo jar
        uses: actions/download-artifact@v4
        with:
          name: neo-jar
          path: build/minecraft-junit/mods/

      - run: ls -R build

      - name: run test
        run: "CI=true NEO_VERSION=${{ matrix.neo-version }} ./gradlew --rerun-tasks test"
